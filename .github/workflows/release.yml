# Every push to main that touches the desktop app ships a release: test, build,
# sign with the Developer ID, notarize, zip, and publish GitHub Release v<commit count>. Installed apps update
# themselves from the latest release, and the Homebrew cask follows it too.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit count is the version

      - name: Version
        run: echo "VERSION=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Skip if already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.existing.outputs.released != 'true'
        run: swift test

      # Developer ID signing + notarization. Push-to-main only, so no fork PR can
      # read the secrets. Missing secrets fail the release; there is no fallback.
      - name: Set up Developer ID signing and notarization
        if: steps.existing.outputs.released != 'true'
        run: ../../.github/scripts/setup-signing.sh
        env:
          MACOS_SIGN_CERT_P12: ${{ secrets.MACOS_SIGN_CERT_P12 }}
          MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Build
        if: steps.existing.outputs.released != 'true'
        run: MULCH_VERSION="$VERSION" ./Scripts/build.sh

      # Notarizes the app, staples it, and zips the stapled app. A rejection fails
      # the job, so an un-notarized build never publishes.
      - name: Notarize and package
        if: steps.existing.outputs.released != 'true'
        run: ./Scripts/package.sh

      # The app reads its version from the release title and downloads Mulch.zip, so
      # keep both names. The cask installs releases/latest/download/Mulch.zip.
      - name: Publish
        if: steps.existing.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/Mulch.zip \
            --title "Mulch $VERSION" --target "$GITHUB_SHA" --generate-notes --latest
